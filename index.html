<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2127;
    --ink-soft:#3E5470;
    --blue-deep:#0B385F;
    --blue-line: rgba(51,115,176,0.4);
    --blue-mid:#3373B0;
    --blue-mid-dark:#0B385F;
    --line:#BED4E9;
    --card:#ffffff;
    --gold:#D9A441;
    --danger:#B0483B;
    --danger-dark:#8F392E;
    --pill-bg:#E7F1FB;
    --paper:#FBF6EA;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:#fff;
    background-image:
      repeating-linear-gradient(0deg, rgba(51,115,176,0.38) 0px, rgba(51,115,176,0.38) 14px, transparent 14px, transparent 30px),
      repeating-linear-gradient(90deg, rgba(51,115,176,0.38) 0px, rgba(51,115,176,0.38) 14px, transparent 14px, transparent 30px);
    background-position: center center;
    color:var(--ink);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    padding:14px;
    position:relative;
  }
  .page-frame{
    padding-bottom:40px;
    min-height:calc(100vh - 28px);
  }
  h1,h2,h3, .display{ font-family:'Pacifico', cursive; color:var(--blue-deep); margin:0; font-weight:400; }

  header.topbar{
    background:var(--paper);
    padding:32px 20px 20px;
    text-align:center;
    max-width:490px;
    margin:16px auto 22px;
    border-radius:3px;
    box-shadow:4px 7px 16px rgba(28,33,39,0.25);
    transform:rotate(-0.6deg);
    position:relative;
  }
  header.topbar::before{
    content:"";
    position:absolute; top:-15px; left:50%;
    width:110px; height:32px;
    background:var(--blue-mid);
    transform:translateX(-50%) rotate(-3deg);
    border-radius:2px;
    box-shadow:0 2px 5px rgba(0,0,0,0.18);
  }
  header.topbar h1{ font-size:36px; }
  header.topbar p{ margin:2px 0 0; font-size:13px; color:var(--ink-soft); font-family:'Poppins'; }

  main{ max-width:520px; margin:0 auto; padding:20px 16px 0; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-family:'Poppins', sans-serif;
    font-weight:600; font-size:14.5px;
    padding:12px 18px;
    border-radius:10px;
    border:1.5px solid var(--blue-mid-dark);
    background:var(--blue-mid);
    color:#fff;
    cursor:pointer;
  }
  .btn:active{ transform: translateY(1px); }
  .btn.secondary{ background:#fff; color:var(--blue-deep); border-color:var(--line); }
  .btn.danger{ background:var(--danger); color:#fff; border-color:var(--danger-dark); }
  .btn.ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .btn.block{ width:100%; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:3px solid var(--gold); outline-offset:2px;
  }

  .fab-row{ margin:18px 0 14px; display:flex; flex-direction:column; gap:8px; }
  .fab-row .row2{ display:flex; gap:8px; }
  .fab-row .row2 .btn{ flex:1; }

  .card{
    background:var(--paper);
    border:none;
    border-radius:3px;
    padding:20px 18px 16px;

  .ing-view-row{ display:flex; justify-content:space-between; padding:10px 8px; border-bottom:1px dashed var(--line); font-size:15px; cursor:pointer; border-radius:6px; }

  .steps-view{ white-space:pre-wrap; line-height:1.8; font-size:15px; }

  .row-btns{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  .checkbox-list{ display:flex; flex-direction:column; gap:2px; }
  .checkbox-item{
    display:flex !important; align-items:center; gap:10px;
    font-size:15px; font-weight:400 !important; color:var(--ink) !important;
    text-transform:none; letter-spacing:0; margin:0 !important;
    padding:8px 2px; cursor:pointer;
  }
  .checkbox-item input[type=checkbox]{ width:19px; height:19px; accent-color:var(--blue-mid); flex-shrink:0; }

  .bulk-preview-card{ padding:10px 14px; }

  .selection-bar{
    display:none; align-items:center; gap:10px;
    background:#F5F8FC; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:14px; position:sticky; top:8px; z-index:5;
  }
  .selection-bar span{ flex:1; font-size:14px; font-weight:600; color:var(--ink-soft); font-family:'Poppins'; }
  .selection-bar .btn{ padding:9px 14px; font-size:13px; }

  .recipe-card.selected{ border-color:var(--blue-mid); border-width:2px; background:#F5F8FC; }
  .select-badge{
    position:absolute; top:10px; left:10px; width:22px; height:22px; border-radius:50%;
    border:2px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#fff; z-index:1;
  }
  .select-badge.checked{ background:var(--blue-mid); border-color:var(--blue-mid); }

  .trash-card{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .trash-card .info h4{ margin:0; font-size:16px; font-family:'Poppins'; font-weight:600; }
  .trash-card .info .meta{ font-size:12px; color:var(--ink-soft); }
  .trash-card .actions{ display:flex; gap:6px; }
  .trash-card .actions .btn{ padding:8px 10px; font-size:12px; }
</style>

<body>

<div class="page-frame">
<header class="topbar">
  <h1>Recipe Notebook</h1>
  <p>A Recipe Book for Waii</p>
</header>

<main id="app"></main>
</div>

<script>
const STORAGE_KEY = 'recipeApp_recipes_v1';
const TRASH_RETENTION_MS = 7 * 24 * 60 * 60 * 1000;

function loadAllRaw(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveAllRaw(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function loadRecipes(){ return loadAllRaw().filter(r=> !r.deletedAt); }
function loadTrash(){ return loadAllRaw().filter(r=> r.deletedAt); }
function purgeOldTrash(){
  const all = loadAllRaw();
  const cutoff = Date.now() - TRASH_RETENTION_MS;
  const kept = all.filter(r=> !(r.deletedAt && r.deletedAt < cutoff));
  if(kept.length !== all.length) saveAllRaw(kept);
}
function uid(){ return 'r' + Date.now() + Math.random().toString(16).slice(2,8); }

let state = { view:'list', recipeId:null, draft:null, filterCuisine:'', filterProtein:'', searchQuery:'', sortBy:'newest', bulkPreview:null, selectMode:false, selectedIds:new Set() };

// ---------- Parsing ----------
const FRACTION_MAP = { '¼':0.25, '½':0.5, '¾':0.75, '⅓':1/3, '⅔':2/3, '⅛':0.125, '⅜':0.375, '⅝':0.625, '⅞':0.875 };
const QTY_CHARS = '0-9¼½¾⅓⅔⅛⅜⅝⅞';
const hasQty = (line) => new RegExp('[' + QTY_CHARS + ']').test(line);

function parseAmount(raw){
  if(raw===undefined || raw===null) return 0;
  raw = (''+raw).trim();
  if(raw==='') return 0;
  if(FRACTION_MAP[raw] !== undefined) return FRACTION_MAP[raw];
  let m = raw.match(/^([0-9]+)\s+([0-9]+)\/([0-9]+)$/);
  if(m) return parseFloat(m[1]) + (parseFloat(m[2])/parseFloat(m[3]));
  m = raw.match(/^([0-9]+)\/([0-9]+)$/);
  if(m) return parseFloat(m[1])/parseFloat(m[2]);
  const f = parseFloat(raw.replace(',', '.'));
  return isNaN(f) ? 0 : f;
}

function splitLineQty(line){
  const m = line.match(/^(.*?)\s*([0-9]+\s+[0-9]+\/[0-9]+|[0-9]+\/[0-9]+|[0-9]+(?:[.,][0-9]+)?|¼|½|¾|⅓|⅔|⅛|⅜|⅝|⅞)\s*(.*)$/);
  if(!m) return { namePart:'', amount:0, unit:'' };
  const namePart = m[1].trim();
  const unit = m[3].trim();
  const amount = parseAmount(m[2]);
  return { namePart, amount, unit };
}

function parseIngredientText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const results = [];
  let pendingName = null;

  lines.forEach(line=>{
    if(line.includes('\t')){
      if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); pendingName = null; }
      const parts = line.split('\t').map(p=>p.trim()).filter((p,i,arr)=> !(p==='' && i===arr.length-1));
      const name = parts[0] || '';
      const amountRaw = parts[1] !== undefined ? parts[1] : '';
      const unit = parts[2] !== undefined ? parts[2] : '';
      const amount = parseAmount(amountRaw);
      if(name) results.push({ name, amount, unit });
      return;
    }

    if(!hasQty(line)){
      if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); }
      pendingName = line;
      return;
    }

    const { namePart, amount, unit } = splitLineQty(line);
    if(namePart){
      if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); pendingName = null; }
      results.push({ name:namePart, amount, unit });
    } else if(pendingName){
      results.push({ name:pendingName, amount, unit });
      pendingName = null;
    } else {
      results.push({ name:line, amount, unit });
    }
  });

  if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); }
  return results.filter(i=> i.name !== '');
}

function parseBulkSheet(text){
  const rawLines = text.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
  const recipes = [];
  let current = null;

  rawLines.forEach(line=>{
    if(!line.includes('\t')) return;
    const cols = line.split('\t').map(c=>c.trim());
    const menu = cols[0] || '';
    const ingName = cols[1] || '';
    const amtRaw = cols[2] || '';
    const unit = cols[3] || '';
    const howTo = cols[5] || '';

    if(/^(menu)$/i.test(menu) && /^(ingredient)$/i.test(ingName)) return;

    if(menu){
      current = { name: menu, ingredients:[], mainIndex:0, instructions:'', notes:'', cuisine:'', proteins:[] };
      recipes.push(current);
    }
    if(!current) return;

    if(ingName){
      current.ingredients.push({ name: ingName, amount: parseAmount(amtRaw), unit });
    }
    if(howTo){
      current.instructions = current.instructions ? (current.instructions + '\n' + howTo) : howTo;
    }
  });

  return recipes.filter(r=> r.ingredients.length>0);
}

const CUISINE_OPTIONS = ['Thai','Chinese','Japanese','Korean','Indian','Western','Bakery','Sauce','Spices & Seasoning','Beverage','Fermented','Other'];
const PROTEIN_OPTIONS = ['Pork','Beef','Poultry','Seafood','Egg','Processed/Cured Meat','No Meat / Vegetarian'];

// ---------- Rendering ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.view==='list') app.appendChild(renderList());
  else if(state.view==='form') app.appendChild(renderForm());
  else if(state.view==='detail') app.appendChild(renderDetail());
  else if(state.view==='bulk') app.appendChild(renderBulk());
  else if(state.view==='trash') app.appendChild(renderTrash());
}

function el(tag, opts={}, children=[]){
  const e = document.createElement(tag);
  if(opts.class) e.className = opts.class;
  if(opts.text) e.textContent = opts.text;
  if(opts.html) e.innerHTML = opts.html;
  if(opts.attrs) Object.entries(opts.attrs).forEach(([k,v])=>e.setAttribute(k,v));
  if(opts.on) Object.entries(opts.on).forEach(([evt,fn])=>e.addEventListener(evt,fn));
  (children||[]).forEach(c=> c && e.appendChild(c));
  return e;
}

function sortRecipes(list, sortBy){
  const arr = list.slice();
  if(sortBy==='oldest') arr.sort((a,b)=> a.createdAt - b.createdAt);
  else if(sortBy==='az') arr.sort((a,b)=> a.name.localeCompare(b.name));
  else if(sortBy==='za') arr.sort((a,b)=> b.name.localeCompare(a.name));
  else arr.sort((a,b)=> b.createdAt - a.createdAt); // newest (default)
  return arr;
}

function renderList(){
  const wrap = el('div');
  const allRecipes = loadRecipes();
  const trashCount = loadTrash().length;

  const fabRow = el('div', {class:'fab-row'}, [
    el('button', {class:'btn block', text:'+ New Recipe', on:{click:()=>{
      state.draft = { id:null, name:'', ingredients:[], mainIndex:0, instructions:'', notes:'', cuisine:'', proteins:[] };
      state.view='form'; render();
    }}}),
    el('div', {class:'row2'}, [
      el('button', {class:'btn secondary', text:'Import from Sheet', on:{click:()=>{
        state.bulkPreview = null;
        state.view='bulk'; render();
      }}}),
      el('button', {class:'btn secondary', text:'🎲 Surprise Me', on:{click:()=>{
        const pool = applyFiltersTo(allRecipes);
        if(pool.length===0){ alert('No recipes to pick from.'); return; }
        const pick = pool[Math.floor(Math.random()*pool.length)];
        state.recipeId = pick.id; state.view='detail'; render();
      }}})
    ]),
    el('button', {class:'btn block', text: 'Trash' + (trashCount>0 ? (' (' + trashCount + ')') : ''), on:{click:()=>{
      state.view='trash'; render();
    }}})
  ]);
  wrap.appendChild(fabRow);

  const selectionBar = el('div', {class:'selection-bar'});
  const selectionCountLabel = el('span', {text:'0 selected'});
  const deleteSelectedBtn = el('button', {class:'btn danger', text:'Move to Trash'});
  const cancelSelectBtn = el('button', {class:'btn ghost', text:'Cancel'});
  selectionBar.appendChild(selectionCountLabel);
  selectionBar.appendChild(deleteSelectedBtn);
  selectionBar.appendChild(cancelSelectBtn);
  wrap.appendChild(selectionBar);

  if(allRecipes.length===0){
    wrap.appendChild(el('div', {class:'empty'}, [
      el('div', {class:'display', text:'Your recipe book is empty'}),
      el('div', {text:'Start your first recipe with the "+ New Recipe" button above.'})
    ]));
    return wrap;
  }

  const searchInput = el('input', {attrs:{type:'text', placeholder:'Search recipe name or ingredient...'}});
  searchInput.value = state.searchQuery || '';
  searchInput.style.marginBottom = '10px';
  wrap.appendChild(searchInput);

  const filterRow = el('div', {class:'filter-row'});
  const cuisineSel = el('select', {});
  cuisineSel.appendChild(el('option', {text:'All Cuisines', attrs:{value:''}}));
  CUISINE_OPTIONS.forEach(c=> cuisineSel.appendChild(el('option', {text:c, attrs:{value:c}})));
  cuisineSel.value = state.filterCuisine;

  const proteinSel = el('select', {});
  proteinSel.appendChild(el('option', {text:'All Proteins', attrs:{value:''}}));
  PROTEIN_OPTIONS.forEach(p=> proteinSel.appendChild(el('option', {text:p, attrs:{value:p}})));
  proteinSel.value = state.filterProtein;

  const sortSel = el('select', {});
  [['newest','Newest first'],['oldest','Oldest first'],['az','A – Z'],['za','Z – A']].forEach(([v,l])=>{
    sortSel.appendChild(el('option', {text:l, attrs:{value:v}}));
  });
  sortSel.value = state.sortBy;

  filterRow.appendChild(cuisineSel);
  filterRow.appendChild(proteinSel);
  wrap.appendChild(filterRow);
  const sortRow = el('div', {class:'filter-row'});
  sortRow.appendChild(sortSel);
  wrap.appendChild(sortRow);

  const listContainer = el('div');
  wrap.appendChild(listContainer);

  function applyFiltersTo(list){
    const q = (state.searchQuery || '').trim().toLowerCase();
    return list.filter(r=>{
      const matchesSearch = !q || r.name.toLowerCase().includes(q) || r.ingredients.some(i=> i.name.toLowerCase().includes(q));
      const matchesCuisine = !state.filterCuisine || r.cuisine===state.filterCuisine;
      const matchesProtein = !state.filterProtein || (r.proteins||[]).includes(state.filterProtein);
      return matchesSearch && matchesCuisine && matchesProtein;
    });
  }

  function updateModeUI(){
    fabRow.style.display = state.selectMode ? 'none' : '';
    selectionBar.style.display = state.selectMode ? 'flex' : 'none';
    selectionCountLabel.textContent = state.selectedIds.size + ' selected';
  }

  function toggleSelect(id){
    if(state.selectedIds.has(id)) state.selectedIds.delete(id); else state.selectedIds.add(id);
    updateModeUI();
    renderCards();
  }

  function buildCard(r){
    const main = r.ingredients[r.mainIndex];
    const tagPills = el('div', {class:'pill-row'});
    if(r.cuisine) tagPills.appendChild(el('span', {class:'pill', text:r.cuisine}));
    (r.proteins||[]).forEach(p=> tagPills.appendChild(el('span', {class:'pill', text:p})));

    const isSelected = state.selectedIds.has(r.id);
    const cardClass = 'card recipe-card' + (isSelected ? ' selected' : '') + (state.selectMode ? ' with-badge' : '');
    const starBtn = el('button', {class:'star-toggle', text: r.favorite ? '★' : '☆'});
    starBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const all = loadAllRaw();
      const idx = all.findIndex(x=>x.id===r.id);
      if(idx>-1){ all[idx].favorite = !all[idx].favorite; saveAllRaw(all); renderCards(); }
    });

    const card = el('div', {class:cardClass}, [
      state.selectMode ? el('div', {class:'select-badge' + (isSelected?' checked':'')}, [el('span', {text: isSelected ? '✓' : ''})]) : starBtn,
      el('h3', {text:r.name || '(Untitled Recipe)'}),
      main ? el('span', {class:'tag', text:'Main ingredient: ' + main.name} ) : null,
      (r.cuisine || (r.proteins||[]).length) ? tagPills : null,
      el('div', {class:'meta', text: r.ingredients.length + ' ingredients'})
    ]);

    let pressTimer = null;
    let longPressFired = false;
    const startPress = ()=>{
      longPressFired = false;
      pressTimer = setTimeout(()=>{
        longPressFired = true;
        if(!state.selectMode){ state.selectMode = true; state.selectedIds = new Set(); }
        toggleSelect(r.id);
      }, 480);
    };
    const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

    card.addEventListener('touchstart', startPress, {passive:true});
    card.addEventListener('touchend', cancelPress);
    card.addEventListener('touchmove', cancelPress);
    card.addEventListener('mousedown', startPress);
    card.addEventListener('mouseup', cancelPress);
    card.addEventListener('mouseleave', cancelPress);
    card.addEventListener('click', ()=>{
      if(longPressFired){ longPressFired = false; return; }
      if(state.selectMode){ toggleSelect(r.id); return; }
      state.recipeId = r.id; state.view='detail'; render();
    });

    return card;
  }

  function renderCards(){
    listContainer.innerHTML = '';
    const filtered = applyFiltersTo(allRecipes);
    if(filtered.length===0){
      listContainer.appendChild(el('div', {class:'empty'}, [
        el('div', {text:'No recipes match your search/filters.'})
      ]));
      return;
    }
    const favorites = sortRecipes(filtered.filter(r=>r.favorite), state.sortBy);
    const others = sortRecipes(filtered.filter(r=>!r.favorite), state.sortBy);

    if(favorites.length>0){
      listContainer.appendChild(el('div', {class:'section-title', text:'★ Favorites'}));
      favorites.forEach(r=> listContainer.appendChild(buildCard(r)));
      listContainer.appendChild(el('div', {class:'section-title', text:'All Recipes'}));
    }
    others.forEach(r=> listContainer.appendChild(buildCard(r)));
  }
  renderCards();
  updateModeUI();

  searchInput.addEventListener('input', e=>{ state.searchQuery = e.target.value; renderCards(); });
  cuisineSel.addEventListener('change', e=>{ state.filterCuisine = e.target.value; renderCards(); });
  proteinSel.addEventListener('change', e=>{ state.filterProtein = e.target.value; renderCards(); });
  sortSel.addEventListener('change', e=>{ state.sortBy = e.target.value; renderCards(); });

  deleteSelectedBtn.addEventListener('click', ()=>{
    const count = state.selectedIds.size;
    if(count===0){ alert('No recipes selected.'); return; }
    if(confirm('Move ' + count + ' recipe(s) to Trash? You can restore them within 7 days.')){
      const all = loadAllRaw();
      all.forEach(r=>{ if(state.selectedIds.has(r.id)) r.deletedAt = Date.now(); });
      saveAllRaw(all);
      state.selectMode = false;
      state.selectedIds = new Set();
      state.view='list';
      render();
    }
  });

  cancelSelectBtn.addEventListener('click', ()=>{
    state.selectMode = false;
    state.selectedIds = new Set();
    updateModeUI();
    renderCards();
  });

  return wrap;
}

function renderForm(){
  const d = state.draft;
  const isEdit = !!d.id;
  const wrap = el('div');
  const sheet = el('div', {class:'form-sheet'});

  sheet.appendChild(el('div', {class:'backlink', text:'← Back', on:{click:()=>{ state.view = isEdit ? 'detail' : 'list'; render(); }}}));
  sheet.appendChild(el('h2', {class:'display', text: isEdit ? 'Edit Recipe' : 'New Recipe'}));

  sheet.appendChild(el('label', {text:'Recipe Name'}));
  const nameInput = el('input', {attrs:{type:'text', placeholder:'e.g. Southern Fish Curry', value:d.name||''}});
  sheet.appendChild(nameInput);

  sheet.appendChild(el('div', {class:'section-title', text:'Category'}));
  sheet.appendChild(el('label', {text:'Cuisine Type'}));
  const cuisineSelect = el('select', {});
  cuisineSelect.appendChild(el('option', {text:'Not specified', attrs:{value:''}}));
  CUISINE_OPTIONS.forEach(c=> cuisineSelect.appendChild(el('option', {text:c, attrs:{value:c}})));
  cuisineSelect.value = d.cuisine || '';
  sheet.appendChild(cuisineSelect);

  sheet.appendChild(el('label', {text:'Main Protein (select any that apply)'}));
  const proteinBox = el('div', {class:'checkbox-list'});
  const proteinChecks = {};
  const selectedProteins = new Set(d.proteins || []);
  PROTEIN_OPTIONS.forEach(p=>{
    const cb = el('input', {attrs:{type:'checkbox'}});
    cb.checked = selectedProteins.has(p);
    proteinChecks[p] = cb;
    const lbl = el('label', {class:'checkbox-item'}, [cb, el('span', {text:p})]);
    proteinBox.appendChild(lbl);
  });
  sheet.appendChild(proteinBox);

  sheet.appendChild(el('div', {class:'section-title', text:'Ingredients'}));

  const pasteBox = el('textarea', {class:'paste-box', attrs:{placeholder:'Paste ingredients here — works with Google Sheets copy-paste, or plain text from a blog\n\nExample:\nChicken breast\t1\tkg\nFish sauce\t2\ttbsp'}});
  sheet.appendChild(pasteBox);
  sheet.appendChild(el('div', {class:'hint', text:'Click "Extract Ingredients" below. Works with Google Sheets (tab-separated) or plain continuous text from a blog/website. Fix any mistakes in the table below afterward.'}));

  const tableWrap = el('div', {attrs:{id:'ing-table-wrap'}});
  sheet.appendChild(tableWrap);

  let ingredients = d.ingredients.map(i=>({...i}));
  let mainIndex = d.mainIndex || 0;

  function renderIngTable(){
    tableWrap.innerHTML = '';
    if(ingredients.length===0) return;
    const table = el('table', {class:'ing-table'});
    table.appendChild(el('tr', {}, [
      el('th', {text:'Main'}), el('th', {text:'Ingredient'}), el('th', {text:'Amount'}), el('th', {text:'Unit'}), el('th', {})
    ]));
    ingredients.forEach((ing, idx)=>{
      const radio = el('input', {attrs:{type:'radio', name:'mainIng'}, class:'main-radio'});
      radio.checked = (idx===mainIndex);
      radio.addEventListener('change', ()=>{ mainIndex = idx; });

      const nameI = el('input', {class:'name-input', attrs:{type:'text', value:ing.name}});
      nameI.addEventListener('input', e=> ing.name = e.target.value);
      const amtI = el('input', {class:'amt-input', attrs:{type:'number', step:'any', value:ing.amount}});
      amtI.addEventListener('input', e=> ing.amount = parseFloat(e.target.value)||0);
      const unitI = el('input', {class:'unit-input', attrs:{type:'text', value:ing.unit}});
      unitI.addEventListener('input', e=> ing.unit = e.target.value);

      const delBtn = el('button', {class:'del-row', text:'✕', attrs:{type:'button'}});
      delBtn.addEventListener('click', ()=>{
        ingredients.splice(idx,1);
        if(mainIndex>=ingredients.length) mainIndex = Math.max(0, ingredients.length-1);
        renderIngTable();
      });

      const tr = el('tr', {}, [
        el('td', {}, [radio]), el('td', {}, [nameI]), el('td', {}, [amtI]), el('td', {}, [unitI]), el('td', {}, [delBtn])
      ]);
      table.appendChild(tr);
    });
    tableWrap.appendChild(table);
    tableWrap.appendChild(el('div', {class:'hint', text:'Select the "Main" ingredient you will use as the reference for scaling (e.g. the meat).'}));
  }
  renderIngTable();

  const parseBtn = el('button', {class:'btn secondary block', text:'Extract Ingredients', attrs:{type:'button'}});
  parseBtn.addEventListener('click', ()=>{
    const parsed = parseIngredientText(pasteBox.value);
    if(parsed.length===0){ alert('No ingredients could be extracted. Check the pasted format.'); return; }
    ingredients = ingredients.concat(parsed);
    mainIndex = mainIndex || 0;
    pasteBox.value = '';
    renderIngTable();
  });
  sheet.appendChild(parseBtn);

  const addRowBtn = el('button', {class:'btn block', text:'+ Add Empty Row', attrs:{type:'button'}});
  addRowBtn.style.marginTop='8px';
  addRowBtn.addEventListener('click', ()=>{
    ingredients.push({name:'', amount:0, unit:''});
    renderIngTable();
  });
  sheet.appendChild(addRowBtn);

  sheet.appendChild(el('div', {class:'section-title', text:'Method'}));
  const stepsInput = el('textarea', {attrs:{placeholder:'Write the method now, or leave blank and add it later.'}});
  stepsInput.value = d.instructions || '';
  sheet.appendChild(stepsInput);

  sheet.appendChild(el('div', {class:'section-title', text:'Personal Notes'}));
  const notesInput = el('textarea', {attrs:{placeholder:'Private notes, e.g. "use less salt next time" or "family prefers it milder"'}});
  notesInput.value = d.notes || '';
  sheet.appendChild(notesInput);

  const saveBtn = el('button', {class:'btn block', text: isEdit ? 'Save Changes' : 'Save Recipe'});
  saveBtn.style.marginTop='22px';
  saveBtn.addEventListener('click', ()=>{
    const name = nameInput.value.trim();
    if(!name){ alert('Please enter a recipe name.'); return; }
    if(ingredients.length===0){ alert('Please add at least one ingredient.'); return; }
    const cuisine = cuisineSelect.value;
    const proteins = PROTEIN_OPTIONS.filter(p=> proteinChecks[p].checked);
    const all = loadAllRaw();
    if(isEdit){
      const idx = all.findIndex(r=>r.id===d.id);
      all[idx] = { ...all[idx], name, ingredients, mainIndex, instructions: stepsInput.value, notes: notesInput.value, cuisine, proteins };
      state.recipeId = d.id;
    } else {
      const newRecipe = { id:uid(), name, ingredients, mainIndex, instructions: stepsInput.value, notes: notesInput.value, cuisine, proteins, favorite:false, deletedAt:null, createdAt: Date.now() };
      all.push(newRecipe);
      state.recipeId = newRecipe.id;
    }
    saveAllRaw(all);
    state.view='detail';
    render();
  });
  sheet.appendChild(saveBtn);

  if(isEdit){
    const cancelBtn = el('button', {class:'btn ghost block', text:'Cancel'});
    cancelBtn.style.marginTop='10px';
    cancelBtn.addEventListener('click', ()=>{ state.view='detail'; render(); });
    sheet.appendChild(cancelBtn);
  }

  wrap.appendChild(sheet);
  return wrap;
}

function renderDetail(){
  const recipes = loadRecipes();
  const r = recipes.find(x=>x.id===state.recipeId);
  if(!r){ state.view='list'; return renderList(); }
  const wrap = el('div');

  wrap.appendChild(el('div', {class:'backlink', text:'← Back to Recipe Book', on:{click:()=>{ state.view='list'; render(); }}}));

  const titleCard = el('div', {class:'card'});
  wrap.appendChild(titleCard);

  const titleRow = el('div', {attrs:{style:'display:flex;align-items:flex-start;justify-content:space-between;gap:10px;'}});
  titleRow.appendChild(el('h2', {class:'display', text:r.name, attrs:{style:'font-size:34px;'}}));
  const starBtn = el('button', {class:'star-toggle', attrs:{style:'position:static;font-size:26px;'}, text: r.favorite ? '★' : '☆'});
  starBtn.addEventListener('click', ()=>{
    const all = loadAllRaw();
    const idx = all.findIndex(x=>x.id===r.id);
    all[idx].favorite = !all[idx].favorite;
    saveAllRaw(all);
    render();
  });
  titleRow.appendChild(starBtn);
  titleCard.appendChild(titleRow);

  if(r.cuisine || (r.proteins||[]).length){
    const tagPills = el('div', {class:'pill-row', attrs:{style:'margin-top:8px;'}});
    if(r.cuisine) tagPills.appendChild(el('span', {class:'pill', text:r.cuisine}));
    (r.proteins||[]).forEach(p=> tagPills.appendChild(el('span', {class:'pill', text:p})));
    titleCard.appendChild(tagPills);
  }

  let sessionMainIndex = r.mainIndex;

  const scaleBoxContainer = el('div');
  wrap.appendChild(scaleBoxContainer);
  const ingListContainer = el('div', {class:'card'});
  wrap.appendChild(ingListContainer);

  function buildIngList(ratio){
    ingListContainer.innerHTML = '';
    r.ingredients.forEach((ing, idx)=>{
      const scaled = (ing.amount * ratio);
      const scaledStr = (Math.round(scaled*100)/100).toString();
      const rowEl = el('div', {class:'ing-view-row' + (idx===sessionMainIndex?' is-main':'')}, [
        el('span', {class:'name', text: ing.name}),
        el('span', {class:'amt', text: scaledStr + (ing.unit?(' '+ing.unit):'')})
      ]);
      rowEl.addEventListener('click', ()=>{
        if(idx===sessionMainIndex) return;
        sessionMainIndex = idx;
        buildScaleBox();
      });
      ingListContainer.appendChild(rowEl);
    });
  }

  function buildScaleBox(){
    scaleBoxContainer.innerHTML = '';
    const main = r.ingredients[sessionMainIndex];
    if(!main){ buildIngList(1); return; }
    const scaleBox = el('div', {class:'scale-box'});
    const ratioStampEl = el('div', {class:'ratio-stamp', text:'1.0×'});
    scaleBox.appendChild(el('label', {text:'How much "' + main.name + '" do you have? (' + (main.unit||'unit') + ')'}));
    scaleBox.appendChild(ratioStampEl);
    const row = el('div', {class:'row'});
    const scaleInput = el('input', {attrs:{type:'number', step:'any', value:main.amount}});
    row.appendChild(scaleInput);
    scaleBox.appendChild(row);
    scaleBoxContainer.appendChild(scaleBox);

    function updateRatio(){
      const val = parseFloat(scaleInput.value) || 0;
      const ratio = main.amount>0 ? (val/main.amount) : 1;
      ratioStampEl.textContent = (Math.round(ratio*100)/100) + '×';
      buildIngList(ratio);
    }
    scaleInput.addEventListener('input', updateRatio);
    updateRatio();
  }
  buildScaleBox();

  const infoCard = el('div', {class:'card'});
  wrap.appendChild(infoCard);

  infoCard.appendChild(el('div', {class:'hint', text:'Tip: tap any ingredient above to use it as the scaling reference instead (just for this viewing session).'}));

  infoCard.appendChild(el('div', {class:'section-title', text:'Method', attrs:{style:'margin-top:20px;'}}));
  const stepsCard = el('div', {attrs:{id:'steps-card'}});
  function renderSteps(){
    stepsCard.innerHTML = '';
    if(r.instructions && r.instructions.trim()){
      stepsCard.appendChild(el('div', {class:'steps-view', text:r.instructions}));
    } else {
      stepsCard.appendChild(el('div', {class:'steps-view empty-steps', text:'No method written yet. Tap edit to add one.'}));
    }
    const editBtn = el('button', {class:'btn secondary', text:'✎ Edit Method'});
    editBtn.style.marginTop='12px';
    editBtn.addEventListener('click', ()=>{
      stepsCard.innerHTML='';
      const ta = el('textarea', {});
      ta.value = r.instructions || '';
      ta.style.minHeight = '160px';
      stepsCard.appendChild(ta);
      const saveStepsBtn = el('button', {class:'btn', text:'Save Method'});
      saveStepsBtn.style.marginTop='10px';
      saveStepsBtn.addEventListener('click', ()=>{
        r.instructions = ta.value;
        const all = loadAllRaw();
        const idx = all.findIndex(x=>x.id===r.id);
        all[idx] = r;
        saveAllRaw(all);
        renderSteps();
      });
      stepsCard.appendChild(saveStepsBtn);
    });
    stepsCard.appendChild(editBtn);
  }
  renderSteps();
  infoCard.appendChild(stepsCard);

  infoCard.appendChild(el('div', {class:'section-title', text:'Personal Notes', attrs:{style:'margin-top:22px;'}}));
  const notesCard = el('div', {attrs:{id:'notes-card'}});
  function renderNotes(){
    notesCard.innerHTML = '';
    if(r.notes && r.notes.trim()){
      notesCard.appendChild(el('div', {class:'steps-view', text:r.notes}));
    } else {
      notesCard.appendChild(el('div', {class:'steps-view empty-steps', text:'No personal notes yet.'}));
    }
    const editBtn = el('button', {class:'btn secondary', text:'✎ Edit Notes'});
    editBtn.style.marginTop='12px';
    editBtn.addEventListener('click', ()=>{
      notesCard.innerHTML='';
      const ta = el('textarea', {});
      ta.value = r.notes || '';
      ta.style.minHeight = '100px';
      notesCard.appendChild(ta);
      const saveNotesBtn = el('button', {class:'btn', text:'Save Notes'});
      saveNotesBtn.style.marginTop='10px';
      saveNotesBtn.addEventListener('click', ()=>{
        r.notes = ta.value;
        const all = loadAllRaw();
        const idx = all.findIndex(x=>x.id===r.id);
        all[idx] = r;
        saveAllRaw(all);
        renderNotes();
      });
      notesCard.appendChild(saveNotesBtn);
    });
    notesCard.appendChild(editBtn);
  }
  renderNotes();
  infoCard.appendChild(notesCard);

  const btnRow = el('div', {class:'row-btns'});
  const duplicateBtn = el('button', {class:'btn secondary', text:'Duplicate'});
  duplicateBtn.addEventListener('click', ()=>{
    const all = loadAllRaw();
    const copy = { ...r, id:uid(), name: r.name + ' (Copy)', favorite:false, deletedAt:null, createdAt: Date.now() };
    all.push(copy);
    saveAllRaw(all);
    state.draft = { id:copy.id, name:copy.name, ingredients:copy.ingredients, mainIndex:copy.mainIndex, instructions:copy.instructions, notes:copy.notes||'', cuisine:copy.cuisine||'', proteins:copy.proteins||[] };
    state.view='form';
    render();
  });
  const editRecipeBtn = el('button', {class:'btn secondary', text:'Edit Recipe'});
  editRecipeBtn.addEventListener('click', ()=>{
    state.draft = { id:r.id, name:r.name, ingredients:r.ingredients, mainIndex:r.mainIndex, instructions:r.instructions, notes:r.notes||'', cuisine:r.cuisine||'', proteins:r.proteins||[] };
    state.view='form'; render();
  });
  const delBtn = el('button', {class:'btn danger', text:'Delete'});
  delBtn.addEventListener('click', ()=>{
    if(confirm('Move "' + r.name + '" to Trash? You can restore it within 7 days.')){
      const all = loadAllRaw();
      const idx = all.findIndex(x=>x.id===r.id);
      all[idx].deletedAt = Date.now();
      saveAllRaw(all);
      state.view='list'; render();
    }
  });
  btnRow.appendChild(duplicateBtn);
  btnRow.appendChild(editRecipeBtn);
  btnRow.appendChild(delBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

function renderBulk(){
  const wrap = el('div');
  wrap.appendChild(el('div', {class:'backlink', text:'← Back to Recipe Book', on:{click:()=>{ state.view='list'; render(); }}}));
  wrap.appendChild(el('h2', {class:'display', text:'Import Multiple Recipes'}));
  wrap.appendChild(el('div', {class:'hint', text:'Paste data from a Google Sheet with columns MENU / INGREDIENT / AMOUNT / UNIT (and HOW TO if present). You can copy several recipes at once — a blank MENU cell means it continues the previous recipe.'}));

  if(!state.bulkPreview){
    const pasteBox = el('textarea', {class:'paste-box', attrs:{style:'min-height:200px;', placeholder:'Paste your Google Sheet data here (copy a range spanning multiple recipes)\n\nExample:\nSour Curry Paste\tDried large chilies\t12\tpcs\n\tGarlic\t10\tg\nShrimp Glass Noodles\tWater\t1\tcup'}});
    wrap.appendChild(pasteBox);

    const parseBtn = el('button', {class:'btn block', text:'Extract Recipes', attrs:{style:'margin-top:14px;'}});
    parseBtn.addEventListener('click', ()=>{
      const parsed = parseBulkSheet(pasteBox.value);
      if(parsed.length===0){ alert('No recipes could be extracted. Make sure this was copied from Google Sheets with tab-separated columns.'); return; }
      state.bulkPreview = parsed.map(r=> ({ ...r, include:true }));
      render();
    });
    wrap.appendChild(parseBtn);
    return wrap;
  }

  wrap.appendChild(el('div', {class:'section-title', text: 'Found ' + state.bulkPreview.length + ' recipe(s) — choose which to import'}));

  state.bulkPreview.forEach((r, idx)=>{
    const cb = el('input', {attrs:{type:'checkbox'}});
    cb.checked = r.include;
    cb.addEventListener('change', e=>{ r.include = e.target.checked; });
    const card = el('div', {class:'card bulk-preview-card'}, [
      el('label', {class:'checkbox-item'}, [
        cb,
        el('div', {}, [
          el('div', {attrs:{style:'font-weight:600;'}, text:r.name}),
          el('div', {class:'meta', text: r.ingredients.length + ' ingredients'})
        ])
      ])
    ]);
    wrap.appendChild(card);
  });

  wrap.appendChild(el('div', {class:'hint', text:'Imported recipes will not have a "main ingredient" or category set yet — edit each one afterward to add that.'}));

  const importBtn = el('button', {class:'btn block', text:'Import Selected', attrs:{style:'margin-top:8px;'}});
  importBtn.addEventListener('click', ()=>{
    const toImport = state.bulkPreview.filter(r=>r.include);
    if(toImport.length===0){ alert('No recipes selected to import.'); return; }
    const all = loadAllRaw();
    toImport.forEach(r=>{
      all.push({
        id: uid(), name: r.name, ingredients: r.ingredients, mainIndex: 0,
        instructions: r.instructions || '', notes:'', cuisine:'', proteins:[], favorite:false, deletedAt:null, createdAt: Date.now()
      });
    });
    saveAllRaw(all);
    state.bulkPreview = null;
    state.view = 'list';
    render();
  });
  wrap.appendChild(importBtn);

  const cancelBtn = el('button', {class:'btn ghost block', text:'Paste Different Text', attrs:{style:'margin-top:8px;'}});
  cancelBtn.addEventListener('click', ()=>{ state.bulkPreview = null; render(); });
  wrap.appendChild(cancelBtn);

  return wrap;
}

function renderTrash(){
  const wrap = el('div');
  wrap.appendChild(el('div', {class:'backlink', text:'← Back to Recipe Book', on:{click:()=>{ state.view='list'; render(); }}}));
  wrap.appendChild(el('h2', {class:'display', text:'Trash'}));

  const trash = loadTrash().sort((a,b)=> b.deletedAt - a.deletedAt);
  if(trash.length===0){
    wrap.appendChild(el('div', {class:'empty'}, [ el('div', {text:'Trash is empty.'}) ]));
    return wrap;
  }

  wrap.appendChild(el('div', {class:'hint', text:'Items are permanently deleted 7 days after being moved to Trash.'}));

  const emptyBtn = el('button', {class:'btn danger block', text:'Empty Trash', attrs:{style:'margin:10px 0 16px;'}});
  emptyBtn.addEventListener('click', ()=>{
    if(confirm('Permanently delete all ' + trash.length + ' item(s) in Trash? This cannot be undone.')){
      saveAllRaw(loadRecipes());
      render();
    }
  });
  wrap.appendChild(emptyBtn);

  trash.forEach(r=>{
    const daysLeft = Math.max(0, 7 - Math.floor((Date.now() - r.deletedAt) / 86400000));
    const card = el('div', {class:'card trash-card'});
    const info = el('div', {class:'info'}, [
      el('h4', {text:r.name}),
      el('div', {class:'meta', text: daysLeft + ' day(s) left before permanent deletion'})
    ]);
    const actions = el('div', {class:'actions'});
    const restoreBtn = el('button', {class:'btn secondary', text:'Restore'});
    restoreBtn.addEventListener('click', ()=>{
      const all = loadAllRaw();
      const idx = all.findIndex(x=>x.id===r.id);
      all[idx].deletedAt = null;
      saveAllRaw(all);
      render();
    });
    const forgetBtn = el('button', {class:'btn danger', text:'Delete Forever'});
    forgetBtn.addEventListener('click', ()=>{
      if(confirm('Permanently delete "' + r.name + '"? This cannot be undone.')){
        const all = loadAllRaw().filter(x=>x.id!==r.id);
        saveAllRaw(all);
        render();
      }
    });
    actions.appendChild(restoreBtn);
    actions.appendChild(forgetBtn);
    card.appendChild(info);
    card.appendChild(actions);
    wrap.appendChild(card);
  });

  return wrap;
}

purgeOldTrash();
render();
</script>
</body>
