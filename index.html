<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดสูตร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500&family=Fraunces:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E7;
    --paper-soft:#FBF8F0;
    --paper-shadow:#E8DFC9;
    --ink:#3B2A1A;
    --ink-soft:#6B5843;
    --leather:#8A6647;
    --leather-dark:#6E5136;
    --rust:#8B4A2B;
    --rust-dark:#6F3A20;
    --moss:#5C6B47;
    --brass:#A9862F;
    --line:#C9B48A;
    --shadow: 0 2px 0 var(--paper-shadow);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(139,74,43,0.06) 0, transparent 40%),
      radial-gradient(circle at 88% 8%, rgba(90,70,40,0.07) 0, transparent 35%),
      radial-gradient(circle at 70% 92%, rgba(139,74,43,0.05) 0, transparent 45%),
      repeating-linear-gradient(0deg, rgba(59,42,26,0.025) 0px, rgba(59,42,26,0.025) 1px, transparent 1px, transparent 26px);
    color:var(--ink);
    font-family:'Kanit', sans-serif;
    font-weight:400;
    min-height:100vh;
    padding-bottom:40px;
  }
  h1,h2,h3, .display{
    font-family:'Kanit', sans-serif;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }
  .num{ font-family:'Fraunces', serif; font-style:italic; }

  header.topbar{
    background:linear-gradient(180deg, var(--paper-soft) 0%, var(--paper) 100%);
    color:var(--ink);
    padding:28px 20px 18px;
    position:relative;
    text-align:center;
  }
  header.topbar h1{
    color:var(--ink);
    font-size:24px;
    letter-spacing:.3px;
    font-weight:600;
  }
  header.topbar .rule{
    width:64px; height:2px; margin:10px auto 0;
    background:var(--brass); opacity:.6; border-radius:2px;
  }
  header.topbar p{
    margin:8px 0 0;
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:.2px;
  }

  main{ max-width:520px; margin:0 auto; padding:20px 16px 0; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-family:'Kanit', sans-serif;
    font-weight:500; font-size:15px;
    padding:12px 18px;
    border-radius:4px;
    border:1.5px solid var(--leather);
    background:var(--rust);
    color:var(--paper-soft);
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .btn:active{ transform: translateY(1px); box-shadow:none; }
  .btn.secondary{ background:var(--paper-soft); color:var(--ink); border-color:var(--line); }
  .btn.danger{ background:#7A3324; color:var(--paper-soft); border-color:#5C271B; }
  .btn.ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); box-shadow:none; }
  .btn.block{ width:100%; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:3px solid var(--moss); outline-offset:2px;
  }

  .fab-row{ margin:18px 0 22px; }

  .card{
    background:var(--paper-soft);
    border:1px solid var(--line);
    border-radius:3px;
    padding:16px;
    margin-bottom:14px;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.3);
    position:relative;
  }
  .recipe-card{ cursor:pointer; }
  .recipe-card::before{
    content:"";
    position:absolute; top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 18px 18px 0;
    border-color:transparent var(--paper) transparent transparent;
    filter: drop-shadow(-1px 1px 1px rgba(59,42,26,0.25));
  }
  .recipe-card h3{ font-size:19px; padding-right:14px; }
  .recipe-card .tag{
    display:inline-block; margin-top:9px;
    font-size:12px; font-weight:600; font-style:italic;
    color:var(--moss);
    border-bottom:1px dotted var(--moss);
    padding-bottom:1px;
  }
  .recipe-card .meta{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty .display{ font-size:20px; margin-bottom:8px; }

  label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin:16px 0 6px; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=number], textarea, select{
    width:100%; font-family:'Kanit', sans-serif; font-size:15px;
    padding:11px 12px; border-radius:3px; border:1.5px solid var(--line);
    background:#FBF6E9; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:90px; }
  textarea.paste-box{ min-height:130px; font-family:monospace; font-size:13px; }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:5px; line-height:1.5; }

  table.ing-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  table.ing-table th{ font-size:12px; text-align:left; color:var(--ink-soft); padding:4px 4px; font-weight:600; }
  table.ing-table td{ padding:5px 4px; vertical-align:middle; }
  table.ing-table input{ padding:7px 8px; font-size:14px; }
  table.ing-table input.name-input{ width:100%; }
  table.ing-table input.amt-input{ width:64px; }
  table.ing-table input.unit-input{ width:56px; }
  table.ing-table .main-radio{ width:20px; height:20px; accent-color:var(--moss); }
  table.ing-table .del-row{ background:none; border:none; color:var(--rust-dark); font-size:18px; cursor:pointer; padding:2px 6px; }

  .backlink{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:14px; margin-bottom:10px; cursor:pointer; font-style:italic; }

  .scale-box{
    background:var(--paper-soft); color:var(--ink);
    border-radius:8px; padding:18px; margin:16px 0; position:relative; overflow:hidden;
    border:1px solid var(--line);
  }
  .scale-box label{ color:var(--ink-soft); }
  .scale-box .row{ display:flex; align-items:center; gap:10px; }
  .scale-box input[type=number]{ background:#FBF6E9; border:1.5px solid var(--line); color:var(--ink); }
  .ratio-stamp{
    position:absolute; top:12px; right:16px;
    font-family:'Fraunces', serif; font-style:italic; font-weight:600;
    font-size:30px; color:var(--brass);
    border:2px solid var(--brass); border-radius:50%;
    width:64px; height:64px; display:flex; align-items:center; justify-content:center;
    transform:rotate(-6deg);
    opacity:.9;
  }

  .ing-view-row{ display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px dashed var(--line); font-size:15px; }
  .ing-view-row:last-child{ border-bottom:none; }
  .ing-view-row .amt{ font-family:'Fraunces', serif; font-weight:600; color:var(--rust-dark); }
  .ing-view-row.is-main .name{ font-weight:700; }
  .ing-view-row.is-main .amt{ color:var(--moss); }

  .steps-view{ white-space:pre-wrap; line-height:1.8; font-size:15px; }
  .steps-view.empty-steps{ color:var(--ink-soft); font-style:italic; }

  .row-btns{ display:flex; gap:10px; margin-top:16px; }
  .row-btns .btn{ flex:1; }

  .section-title{ font-size:13px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:1px; margin:22px 0 8px; display:flex; align-items:center; gap:8px; }
  .section-title:first-of-type{ margin-top:6px; }
  .section-title::after{ content:""; flex:1; height:1px; background:var(--line); }

  .pill-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .pill{
    display:inline-block; font-size:11.5px; font-weight:500;
    background:rgba(169,134,47,0.14); color:var(--rust-dark);
    border:1px solid var(--line); border-radius:20px;
    padding:3px 10px;
  }

  .filter-row{ display:flex; gap:8px; margin-bottom:16px; }
  .filter-row select{ flex:1; font-size:13px; padding:9px 10px; }

  .checkbox-list{ display:flex; flex-direction:column; gap:2px; }
  .checkbox-item{
    display:flex !important; align-items:center; gap:10px;
    font-size:15px; font-weight:400 !important; color:var(--ink) !important;
    text-transform:none; letter-spacing:0; margin:0 !important;
    padding:8px 2px; cursor:pointer;
  }
  .checkbox-item input[type=checkbox]{ width:19px; height:19px; accent-color:var(--moss); flex-shrink:0; }

  .bulk-preview-card{ padding:10px 14px; }
  .bulk-preview-card .checkbox-item{ padding:2px; }
</style>
</head>
<body>

<header class="topbar">
  <h1>สมุดสูตร</h1>
  <div class="rule"></div>
  <p>บันทึกสูตรอาหารของพี่หวาย</p>
</header>

<main id="app"></main>

<script>
const STORAGE_KEY = 'recipeApp_recipes_v1';

function loadRecipes(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveRecipes(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function uid(){ return 'r' + Date.now() + Math.random().toString(16).slice(2,8); }

let state = { view:'list', recipeId:null, draft:null, filterCuisine:'', filterProtein:'', searchQuery:'', bulkPreview:null };

// ---------- Parsing ----------
const FRACTION_MAP = { '¼':0.25, '½':0.5, '¾':0.75, '⅓':1/3, '⅔':2/3, '⅛':0.125, '⅜':0.375, '⅝':0.625, '⅞':0.875 };
const QTY_CHARS = '0-9¼½¾⅓⅔⅛⅜⅝⅞';
const hasQty = (line) => new RegExp('[' + QTY_CHARS + ']').test(line);

function parseAmount(raw){
  if(raw===undefined || raw===null) return 0;
  raw = (''+raw).trim();
  if(raw==='') return 0;
  if(FRACTION_MAP[raw] !== undefined) return FRACTION_MAP[raw];
  let m = raw.match(/^([0-9]+)\s+([0-9]+)\/([0-9]+)$/); // เศษส่วนปนจำนวนเต็ม เช่น "1 1/2"
  if(m) return parseFloat(m[1]) + (parseFloat(m[2])/parseFloat(m[3]));
  m = raw.match(/^([0-9]+)\/([0-9]+)$/); // เศษส่วนธรรมดา เช่น "1/2"
  if(m) return parseFloat(m[1])/parseFloat(m[2]);
  const f = parseFloat(raw.replace(',', '.'));
  return isNaN(f) ? 0 : f;
}

function splitLineQty(line){
  // แยกบรรทัดออกเป็น [ส่วนชื่อ, จำนวน, หน่วย] โดยจับตัวเลข/เศษส่วนตัวแรกที่เจอ (รองรับ 1/2, 1 1/2, ½ ฯลฯ)
  const m = line.match(/^(.*?)\s*([0-9]+\s+[0-9]+\/[0-9]+|[0-9]+\/[0-9]+|[0-9]+(?:[.,][0-9]+)?|¼|½|¾|⅓|⅔|⅛|⅜|⅝|⅞)\s*(.*)$/);
  if(!m) return { namePart:'', amount:0, unit:'' };
  const namePart = m[1].trim();
  const unit = m[3].trim();
  const amount = parseAmount(m[2]);
  return { namePart, amount, unit };
}

function parseIngredientText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const results = [];
  let pendingName = null;

  lines.forEach(line=>{
    if(line.includes('\t')){
      // รูปแบบคัดลอกจาก Google Sheet (มี tab คั่นคอลัมน์)
      if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); pendingName = null; }
      const parts = line.split('\t').map(p=>p.trim()).filter((p,i,arr)=> !(p==='' && i===arr.length-1));
      const name = parts[0] || '';
      const amountRaw = parts[1] !== undefined ? parts[1] : '';
      const unit = parts[2] !== undefined ? parts[2] : '';
      const amount = parseAmount(amountRaw);
      if(name) results.push({ name, amount, unit });
      return;
    }

    if(!hasQty(line)){
      // บรรทัดนี้เป็นแค่ชื่อ ยังไม่มีปริมาณ (อาจจะอยู่บรรทัดถัดไป เช่น copy จากเว็บ 2 คอลัมน์)
      if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); }
      pendingName = line;
      return;
    }

    const { namePart, amount, unit } = splitLineQty(line);
    if(namePart){
      // ชื่อ+ปริมาณอยู่บรรทัดเดียวกัน (เช่น "ไส้กรอกอีสาน 300 กรัม")
      if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); pendingName = null; }
      results.push({ name:namePart, amount, unit });
    } else if(pendingName){
      // บรรทัดนี้มีแต่ปริมาณ/หน่วย ต่อจากชื่อในบรรทัดก่อนหน้า
      results.push({ name:pendingName, amount, unit });
      pendingName = null;
    } else {
      results.push({ name:line, amount, unit });
    }
  });

  if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); }
  return results.filter(i=> i.name !== '');
}

// ---------- นำเข้าหลายสูตรพร้อมกัน (จาก Google Sheet คอลัมน์ MENU / INGREDIENT / AMOUNT / UNIT / HOW TO) ----------
function parseBulkSheet(text){
  const rawLines = text.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
  const recipes = [];
  let current = null;

  rawLines.forEach(line=>{
    if(!line.includes('\t')) return; // ข้ามบรรทัดที่ไม่มี tab คั่น (ไม่ใช่แถวตารางจาก Sheet)
    const cols = line.split('\t').map(c=>c.trim());
    const menu = cols[0] || '';
    const ingName = cols[1] || '';
    const amtRaw = cols[2] || '';
    const unit = cols[3] || '';
    const howTo = cols[5] || '';

    if(/^(menu|เมนู)$/i.test(menu) && /^(ingredient|วัตถุดิบ)$/i.test(ingName)) return; // ข้ามแถวหัวตาราง

    if(menu){
      current = { name: menu, ingredients:[], mainIndex:0, instructions:'', cuisine:'', proteins:[] };
      recipes.push(current);
    }
    if(!current) return;

    if(ingName){
      current.ingredients.push({ name: ingName, amount: parseAmount(amtRaw), unit });
    }
    if(howTo){
      current.instructions = current.instructions ? (current.instructions + '\n' + howTo) : howTo;
    }
  });

  return recipes.filter(r=> r.ingredients.length>0);
}

const CUISINE_OPTIONS = ['ไทย','จีน','ญี่ปุ่น','เกาหลี','อินเดีย','ตะวันตก','เบเกอรี่','ซอส','เครื่องปรุง/เครื่องเทศ','เครื่องดื่ม','หมัก/ดอง','อื่นๆ'];
const PROTEIN_OPTIONS = ['หมู','เนื้อวัว','ไก่/สัตว์ปีก','อาหารทะเล','เนื้อแปรรูป','ไม่มีเนื้อสัตว์'];

// ---------- Rendering ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.view==='list') app.appendChild(renderList());
  else if(state.view==='form') app.appendChild(renderForm());
  else if(state.view==='detail') app.appendChild(renderDetail());
  else if(state.view==='bulk') app.appendChild(renderBulk());
}

function el(tag, opts={}, children=[]){
  const e = document.createElement(tag);
  if(opts.class) e.className = opts.class;
  if(opts.text) e.textContent = opts.text;
  if(opts.html) e.innerHTML = opts.html;
  if(opts.attrs) Object.entries(opts.attrs).forEach(([k,v])=>e.setAttribute(k,v));
  if(opts.on) Object.entries(opts.on).forEach(([evt,fn])=>e.addEventListener(evt,fn));
  (children||[]).forEach(c=> c && e.appendChild(c));
  return e;
}

function renderList(){
  const wrap = el('div');
  const allRecipes = loadRecipes().sort((a,b)=> b.createdAt - a.createdAt);

  wrap.appendChild(el('div', {class:'fab-row'}, [
    el('button', {class:'btn block', text:'+ จดสูตรใหม่', on:{click:()=>{
      state.draft = { id:null, name:'', ingredients:[], mainIndex:0, instructions:'', cuisine:'', proteins:[] };
      state.view='form'; render();
    }}}),
    el('button', {class:'btn ghost block', text:'นำเข้าหลายสูตรจาก Google Sheet', attrs:{style:'margin-top:8px;'}, on:{click:()=>{
      state.bulkPreview = null;
      state.view='bulk'; render();
    }}})
  ]));

  if(allRecipes.length===0){
    wrap.appendChild(el('div', {class:'empty'}, [
      el('div', {class:'display', text:'ยังไม่มีสูตรอาหารในสมุดเล่มนี้'}),
      el('div', {text:'เริ่มจดสูตรแรกกันเลยค่ะ กดปุ่ม "+ จดสูตรใหม่" ด้านบน'})
    ]));
    return wrap;
  }

  const searchInput = el('input', {attrs:{type:'text', placeholder:'ค้นหาชื่อเมนู หรือวัตถุดิบ...'}});
  searchInput.value = state.searchQuery || '';
  searchInput.style.marginBottom = '10px';
  wrap.appendChild(searchInput);

  const filterRow = el('div', {class:'filter-row'});
  const cuisineSel = el('select', {});
  cuisineSel.appendChild(el('option', {text:'ทุกประเภทอาหาร', attrs:{value:''}}));
  CUISINE_OPTIONS.forEach(c=> cuisineSel.appendChild(el('option', {text:c, attrs:{value:c}})));
  cuisineSel.value = state.filterCuisine;

  const proteinSel = el('select', {});
  proteinSel.appendChild(el('option', {text:'ทุกเนื้อสัตว์', attrs:{value:''}}));
  PROTEIN_OPTIONS.forEach(p=> proteinSel.appendChild(el('option', {text:p, attrs:{value:p}})));
  proteinSel.value = state.filterProtein;

  filterRow.appendChild(cuisineSel);
  filterRow.appendChild(proteinSel);
  wrap.appendChild(filterRow);

  const listContainer = el('div');
  wrap.appendChild(listContainer);

  function applyFilters(){
    const q = (state.searchQuery || '').trim().toLowerCase();
    return allRecipes.filter(r=>{
      const matchesSearch = !q || r.name.toLowerCase().includes(q) || r.ingredients.some(i=> i.name.toLowerCase().includes(q));
      const matchesCuisine = !state.filterCuisine || r.cuisine===state.filterCuisine;
      const matchesProtein = !state.filterProtein || (r.proteins||[]).includes(state.filterProtein);
      return matchesSearch && matchesCuisine && matchesProtein;
    });
  }

  function renderCards(){
    listContainer.innerHTML = '';
    const recipes = applyFilters();
    if(recipes.length===0){
      listContainer.appendChild(el('div', {class:'empty'}, [
        el('div', {text:'ไม่พบสูตรที่ตรงกับคำค้นหา/ตัวกรองนี้ค่ะ'})
      ]));
      return;
    }
    recipes.forEach(r=>{
      const main = r.ingredients[r.mainIndex];
      const tagPills = el('div', {class:'pill-row'});
      if(r.cuisine) tagPills.appendChild(el('span', {class:'pill', text:r.cuisine}));
      (r.proteins||[]).forEach(p=> tagPills.appendChild(el('span', {class:'pill', text:p})));

      const card = el('div', {class:'card recipe-card', on:{click:()=>{
        state.recipeId = r.id; state.view='detail'; render();
      }}}, [
        el('h3', {text:r.name || '(ไม่มีชื่อเมนู)'}),
        main ? el('span', {class:'tag', text:'วัตถุดิบหลัก: ' + main.name} ) : null,
        (r.cuisine || (r.proteins||[]).length) ? tagPills : null,
        el('div', {class:'meta', text: r.ingredients.length + ' วัตถุดิบ'})
      ]);
      listContainer.appendChild(card);
    });
  }
  renderCards();

  searchInput.addEventListener('input', e=>{ state.searchQuery = e.target.value; renderCards(); });
  cuisineSel.addEventListener('change', e=>{ state.filterCuisine = e.target.value; renderCards(); });
  proteinSel.addEventListener('change', e=>{ state.filterProtein = e.target.value; renderCards(); });

  return wrap;
}

function renderForm(){
  const d = state.draft;
  const isEdit = !!d.id;
  const wrap = el('div');

  wrap.appendChild(el('div', {class:'backlink', text:'← กลับ', on:{click:()=>{ state.view = isEdit ? 'detail' : 'list'; render(); }}}));
  wrap.appendChild(el('h2', {class:'display', text: isEdit ? 'แก้ไขสูตร' : 'จดสูตรใหม่'}));

  wrap.appendChild(el('label', {text:'ชื่อเมนู'}));
  const nameInput = el('input', {attrs:{type:'text', placeholder:'เช่น ไก่ใต้น้ำ', value:d.name||''}});
  wrap.appendChild(nameInput);

  wrap.appendChild(el('div', {class:'section-title', text:'หมวดหมู่'}));
  wrap.appendChild(el('label', {text:'ประเภทอาหาร'}));
  const cuisineSelect = el('select', {});
  cuisineSelect.appendChild(el('option', {text:'ไม่ระบุ', attrs:{value:''}}));
  CUISINE_OPTIONS.forEach(c=> cuisineSelect.appendChild(el('option', {text:c, attrs:{value:c}})));
  cuisineSelect.value = d.cuisine || '';
  wrap.appendChild(cuisineSelect);

  wrap.appendChild(el('label', {text:'เนื้อสัตว์หลัก (เลือกได้หลายอย่าง)'}));
  const proteinBox = el('div', {class:'checkbox-list'});
  const proteinChecks = {};
