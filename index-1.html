<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดสูตร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500&family=Fraunces:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E7;
    --paper-soft:#FBF8F0;
    --paper-shadow:#E8DFC9;
    --ink:#3B2A1A;
    --ink-soft:#6B5843;
    --leather:#8A6647;
    --leather-dark:#6E5136;
    --rust:#8B4A2B;
    --rust-dark:#6F3A20;
    --moss:#5C6B47;
    --brass:#A9862F;
    --line:#C9B48A;
    --shadow: 0 2px 0 var(--paper-shadow);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(139,74,43,0.06) 0, transparent 40%),
      radial-gradient(circle at 88% 8%, rgba(90,70,40,0.07) 0, transparent 35%),
      radial-gradient(circle at 70% 92%, rgba(139,74,43,0.05) 0, transparent 45%),
      repeating-linear-gradient(0deg, rgba(59,42,26,0.025) 0px, rgba(59,42,26,0.025) 1px, transparent 1px, transparent 26px);
    color:var(--ink);
    font-family:'Kanit', sans-serif;
    font-weight:400;
    min-height:100vh;
    padding-bottom:40px;
  }
  h1,h2,h3, .display{
    font-family:'Kanit', sans-serif;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }
  .num{ font-family:'Fraunces', serif; font-style:italic; }

  header.topbar{
    background:linear-gradient(180deg, var(--paper-soft) 0%, var(--paper) 100%);
    color:var(--ink);
    padding:28px 20px 18px;
    position:relative;
    text-align:center;
  }
  header.topbar h1{
    color:var(--ink);
    font-size:24px;
    letter-spacing:.3px;
    font-weight:600;
  }
  header.topbar .rule{
    width:64px; height:2px; margin:10px auto 0;
    background:var(--brass); opacity:.6; border-radius:2px;
  }
  header.topbar p{
    margin:8px 0 0;
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:.2px;
  }

  main{ max-width:520px; margin:0 auto; padding:20px 16px 0; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-family:'Kanit', sans-serif;
    font-weight:500; font-size:15px;
    padding:12px 18px;
    border-radius:4px;
    border:1.5px solid var(--leather);
    background:var(--rust);
    color:var(--paper-soft);
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .btn:active{ transform: translateY(1px); box-shadow:none; }
  .btn.secondary{ background:var(--paper-soft); color:var(--ink); border-color:var(--line); }
  .btn.danger{ background:#7A3324; color:var(--paper-soft); border-color:#5C271B; }
  .btn.ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); box-shadow:none; }
  .btn.block{ width:100%; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:3px solid var(--moss); outline-offset:2px;
  }

  .fab-row{ margin:18px 0 22px; }

  .card{
    background:var(--paper-soft);
    border:1px solid var(--line);
    border-radius:3px;
    padding:16px;
    margin-bottom:14px;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.3);
    position:relative;
  }
  .recipe-card{ cursor:pointer; }
  .recipe-card::before{
    content:"";
    position:absolute; top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 18px 18px 0;
    border-color:transparent var(--paper) transparent transparent;
    filter: drop-shadow(-1px 1px 1px rgba(59,42,26,0.25));
  }
  .recipe-card h3{ font-size:19px; padding-right:14px; }
  .recipe-card .tag{
    display:inline-block; margin-top:9px;
    font-size:12px; font-weight:600; font-style:italic;
    color:var(--moss);
    border-bottom:1px dotted var(--moss);
    padding-bottom:1px;
  }
  .recipe-card .meta{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty .display{ font-size:20px; margin-bottom:8px; }

  label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin:16px 0 6px; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=number], textarea, select{
    width:100%; font-family:'Kanit', sans-serif; font-size:15px;
    padding:11px 12px; border-radius:3px; border:1.5px solid var(--line);
    background:#FBF6E9; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:90px; }
  textarea.paste-box{ min-height:130px; font-family:monospace; font-size:13px; }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:5px; line-height:1.5; }

  table.ing-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  table.ing-table th{ font-size:12px; text-align:left; color:var(--ink-soft); padding:4px 4px; font-weight:600; }
  table.ing-table td{ padding:5px 4px; vertical-align:middle; }
  table.ing-table input{ padding:7px 8px; font-size:14px; }
  table.ing-table input.name-input{ width:100%; }
  table.ing-table input.amt-input{ width:64px; }
  table.ing-table input.unit-input{ width:56px; }
  table.ing-table .main-radio{ width:20px; height:20px; accent-color:var(--moss); }
  table.ing-table .del-row{ background:none; border:none; color:var(--rust-dark); font-size:18px; cursor:pointer; padding:2px 6px; }

  .backlink{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:14px; margin-bottom:10px; cursor:pointer; font-style:italic; }

  .scale-box{
    background:var(--paper-soft); color:var(--ink);
    border-radius:8px; padding:18px; margin:16px 0; position:relative; overflow:hidden;
    border:1px solid var(--line);
  }
  .scale-box label{ color:var(--ink-soft); }
  .scale-box .row{ display:flex; align-items:center; gap:10px; }
  .scale-box input[type=number]{ background:#FBF6E9; border:1.5px solid var(--line); color:var(--ink); }
  .ratio-stamp{
    position:absolute; top:12px; right:16px;
    font-family:'Fraunces', serif; font-style:italic; font-weight:600;
    font-size:30px; color:var(--brass);
    border:2px solid var(--brass); border-radius:50%;
    width:64px; height:64px; display:flex; align-items:center; justify-content:center;
    transform:rotate(-6deg);
    opacity:.9;
  }

  .ing-view-row{ display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px dashed var(--line); font-size:15px; }
  .ing-view-row:last-child{ border-bottom:none; }
  .ing-view-row .amt{ font-family:'Fraunces', serif; font-weight:600; color:var(--rust-dark); }
  .ing-view-row.is-main .name{ font-weight:700; }
  .ing-view-row.is-main .amt{ color:var(--moss); }

  .steps-view{ white-space:pre-wrap; line-height:1.8; font-size:15px; }
  .steps-view.empty-steps{ color:var(--ink-soft); font-style:italic; }

  .row-btns{ display:flex; gap:10px; margin-top:16px; }
  .row-btns .btn{ flex:1; }

  .section-title{ font-size:13px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:1px; margin:22px 0 8px; display:flex; align-items:center; gap:8px; }
  .section-title:first-of-type{ margin-top:6px; }
  .section-title::after{ content:""; flex:1; height:1px; background:var(--line); }

  .pill-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .pill{
    display:inline-block; font-size:11.5px; font-weight:500;
    background:rgba(169,134,47,0.14); color:var(--rust-dark);
    border:1px solid var(--line); border-radius:20px;
    padding:3px 10px;
  }

  .filter-row{ display:flex; gap:8px; margin-bottom:16px; }
  .filter-row select{ flex:1; font-size:13px; padding:9px 10px; }

  .checkbox-list{ display:flex; flex-direction:column; gap:2px; }
  .checkbox-item{
    display:flex !important; align-items:center; gap:10px;
    font-size:15px; font-weight:400 !important; color:var(--ink) !important;
    text-transform:none; letter-spacing:0; margin:0 !important;
    padding:8px 2px; cursor:pointer;
  }
  .checkbox-item input[type=checkbox]{ width:19px; height:19px; accent-color:var(--moss); flex-shrink:0; }

  .bulk-preview-card{ padding:10px 14px; }
  .bulk-preview-card .checkbox-item{ padding:2px; }

  .selection-bar{
    display:none; align-items:center; gap:10px;
    background:var(--paper-soft); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin-bottom:14px; position:sticky; top:8px; z-index:5;
  }
  .selection-bar span{ flex:1; font-size:14px; font-weight:600; color:var(--ink-soft); }
  .selection-bar .btn{ padding:9px 14px; font-size:13px; }

  .recipe-card.selected{ border-color:var(--moss); border-width:2px; background:rgba(92,107,71,0.08); }
  .select-badge{
    position:absolute; top:10px; left:10px; width:22px; height:22px; border-radius:50%;
    border:2px solid var(--line); background:var(--paper-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#fff; z-index:1;
  }
  .select-badge.checked{ background:var(--moss); border-color:var(--moss); }
  .recipe-card.with-badge{ padding-left:40px; }
</style>
</head>
<body>

<header class="topbar">
  <h1>สมุดสูตร</h1>
  <div class="rule"></div>
  <p>บันทึกสูตรอาหารของพี่หวาย</p>
</header>

<main id="app"></main>

<script>
const STORAGE_KEY = 'recipeApp_recipes_v1';

function loadRecipes(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveRecipes(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function uid(){ return 'r' + Date.now() + Math.random().toString(16).slice(2,8); }

let state = { view:'list', recipeId:null, draft:null, filterCuisine:'', filterProtein:'', searchQuery:'', bulkPreview:null, selectMode:false, selectedIds:new Set() };

// ---------- Parsing ----------
const FRACTION_MAP = { '¼':0.25, '½':0.5, '¾':0.75, '⅓':1/3, '⅔':2/3, '⅛':0.125, '⅜':0.375, '⅝':0.625, '⅞':0.875 };
const QTY_CHARS = '0-9¼½¾⅓⅔⅛⅜⅝⅞';
const hasQty = (line) => new RegExp('[' + QTY_CHARS + ']').test(line);

function parseAmount(raw){
  if(raw===undefined || raw===null) return 0;
  raw = (''+raw).trim();
  if(raw==='') return 0;
  if(FRACTION_MAP[raw] !== undefined) return FRACTION_MAP[raw];
  let m = raw.match(/^([0-9]+)\s+([0-9]+)\/([0-9]+)$/); // เศษส่วนปนจำนวนเต็ม เช่น "1 1/2"
  if(m) return parseFloat(m[1]) + (parseFloat(m[2])/parseFloat(m[3]));
  m = raw.match(/^([0-9]+)\/([0-9]+)$/); // เศษส่วนธรรมดา เช่น "1/2"
  if(m) return parseFloat(m[1])/parseFloat(m[2]);
  const f = parseFloat(raw.replace(',', '.'));
  return isNaN(f) ? 0 : f;
}

function splitLineQty(line){
  // แยกบรรทัดออกเป็น [ส่วนชื่อ, จำนวน, หน่วย] โดยจับตัวเลข/เศษส่วนตัวแรกที่เจอ (รองรับ 1/2, 1 1/2, ½ ฯลฯ)
  const m = line.match(/^(.*?)\s*([0-9]+\s+[0-9]+\/[0-9]+|[0-9]+\/[0-9]+|[0-9]+(?:[.,][0-9]+)?|¼|½|¾|⅓|⅔|⅛|⅜|⅝|⅞)\s*(.*)$/);
  if(!m) return { namePart:'', amount:0, unit:'' };
  const namePart = m[1].trim();
  const unit = m[3].trim();
  const amount = parseAmount(m[2]);
  return { namePart, amount, unit };
}

function parseIngredientText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const results = [];
  let pendingName = null;

  lines.forEach(line=>{
    if(line.includes('\t')){
      // รูปแบบคัดลอกจาก Google Sheet (มี tab คั่นคอลัมน์)
      if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); pendingName = null; }
      const parts = line.split('\t').map(p=>p.trim()).filter((p,i,arr)=> !(p==='' && i===arr.length-1));
      const name = parts[0] || '';
      const amountRaw = parts[1] !== undefined ? parts[1] : '';
      const unit = parts[2] !== undefined ? parts[2] : '';
      const amount = parseAmount(amountRaw);
      if(name) results.push({ name, amount, unit });
      return;
    }

    if(!hasQty(line)){
      // บรรทัดนี้เป็นแค่ชื่อ ยังไม่มีปริมาณ (อาจจะอยู่บรรทัดถัดไป เช่น copy จากเว็บ 2 คอลัมน์)
      if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); }
      pendingName = line;
      return;
    }

    const { namePart, amount, unit } = splitLineQty(line);
    if(namePart){
      // ชื่อ+ปริมาณอยู่บรรทัดเดียวกัน (เช่น "ไส้กรอกอีสาน 300 กรัม")
      if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); pendingName = null; }
      results.push({ name:namePart, amount, unit });
    } else if(pendingName){
      // บรรทัดนี้มีแต่ปริมาณ/หน่วย ต่อจากชื่อในบรรทัดก่อนหน้า
      results.push({ name:pendingName, amount, unit });
      pendingName = null;
    } else {
      results.push({ name:line, amount, unit });
    }
  });

  if(pendingName){ results.push({ name:pendingName, amount:0, unit:'' }); }
  return results.filter(i=> i.name !== '');
}

// ---------- นำเข้าหลายสูตรพร้อมกัน (จาก Google Sheet คอลัมน์ MENU / INGREDIENT / AMOUNT / UNIT / HOW TO) ----------
function parseBulkSheet(text){
  const rawLines = text.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
  const recipes = [];
  let current = null;

  rawLines.forEach(line=>{
    if(!line.includes('\t')) return; // ข้ามบรรทัดที่ไม่มี tab คั่น (ไม่ใช่แถวตารางจาก Sheet)
    const cols = line.split('\t').map(c=>c.trim());
    const menu = cols[0] || '';
    const ingName = cols[1] || '';
    const amtRaw = cols[2] || '';
    const unit = cols[3] || '';
    const howTo = cols[5] || '';

    if(/^(menu|เมนู)$/i.test(menu) && /^(ingredient|วัตถุดิบ)$/i.test(ingName)) return; // ข้ามแถวหัวตาราง

    if(menu){
      current = { name: menu, ingredients:[], mainIndex:0, instructions:'', cuisine:'', proteins:[] };
      recipes.push(current);
    }
    if(!current) return;

    if(ingName){
      current.ingredients.push({ name: ingName, amount: parseAmount(amtRaw), unit });
    }
    if(howTo){
      current.instructions = current.instructions ? (current.instructions + '\n' + howTo) : howTo;
    }
  });

  return recipes.filter(r=> r.ingredients.length>0);
}

const CUISINE_OPTIONS = ['ไทย','จีน','ญี่ปุ่น','เกาหลี','อินเดีย','ตะวันตก','เบเกอรี่','ซอส','เครื่องปรุง/เครื่องเทศ','เครื่องดื่ม','หมัก/ดอง','อื่นๆ'];
const PROTEIN_OPTIONS = ['หมู','เนื้อวัว','ไก่/สัตว์ปีก','อาหารทะเล','เนื้อแปรรูป','ไม่มีเนื้อสัตว์'];

// ---------- Rendering ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.view==='list') app.appendChild(renderList());
  else if(state.view==='form') app.appendChild(renderForm());
  else if(state.view==='detail') app.appendChild(renderDetail());
  else if(state.view==='bulk') app.appendChild(renderBulk());
}

function el(tag, opts={}, children=[]){
  const e = document.createElement(tag);
  if(opts.class) e.className = opts.class;
  if(opts.text) e.textContent = opts.text;
  if(opts.html) e.innerHTML = opts.html;
  if(opts.attrs) Object.entries(opts.attrs).forEach(([k,v])=>e.setAttribute(k,v));
  if(opts.on) Object.entries(opts.on).forEach(([evt,fn])=>e.addEventListener(evt,fn));
  (children||[]).forEach(c=> c && e.appendChild(c));
  return e;
}

function renderList(){
  const wrap = el('div');
  const allRecipes = loadRecipes().sort((a,b)=> b.createdAt - a.createdAt);

  const fabRow = el('div', {class:'fab-row'}, [
    el('button', {class:'btn block', text:'+ จดสูตรใหม่', on:{click:()=>{
      state.draft = { id:null, name:'', ingredients:[], mainIndex:0, instructions:'', cuisine:'', proteins:[] };
      state.view='form'; render();
    }}}),
    el('button', {class:'btn ghost block', text:'นำเข้าหลายสูตรจาก Google Sheet', attrs:{style:'margin-top:8px;'}, on:{click:()=>{
      state.bulkPreview = null;
      state.view='bulk'; render();
    }}})
  ]);
  wrap.appendChild(fabRow);

  const selectionBar = el('div', {class:'selection-bar'});
  const selectionCountLabel = el('span', {text:'เลือกแล้ว 0 สูตร'});
  const deleteSelectedBtn = el('button', {class:'btn danger', text:'ลบที่เลือก'});
  const cancelSelectBtn = el('button', {class:'btn ghost', text:'ยกเลิก'});
  selectionBar.appendChild(selectionCountLabel);
  selectionBar.appendChild(deleteSelectedBtn);
  selectionBar.appendChild(cancelSelectBtn);
  wrap.appendChild(selectionBar);

  if(allRecipes.length===0){
    wrap.appendChild(el('div', {class:'empty'}, [
      el('div', {class:'display', text:'ยังไม่มีสูตรอาหารในสมุดเล่มนี้'}),
      el('div', {text:'เริ่มจดสูตรแรกกันเลยค่ะ กดปุ่ม "+ จดสูตรใหม่" ด้านบน'})
    ]));
    return wrap;
  }

  const searchInput = el('input', {attrs:{type:'text', placeholder:'ค้นหาชื่อเมนู หรือวัตถุดิบ...'}});
  searchInput.value = state.searchQuery || '';
  searchInput.style.marginBottom = '10px';
  wrap.appendChild(searchInput);

  const filterRow = el('div', {class:'filter-row'});
  const cuisineSel = el('select', {});
  cuisineSel.appendChild(el('option', {text:'ทุกประเภทอาหาร', attrs:{value:''}}));
  CUISINE_OPTIONS.forEach(c=> cuisineSel.appendChild(el('option', {text:c, attrs:{value:c}})));
  cuisineSel.value = state.filterCuisine;

  const proteinSel = el('select', {});
  proteinSel.appendChild(el('option', {text:'ทุกเนื้อสัตว์', attrs:{value:''}}));
  PROTEIN_OPTIONS.forEach(p=> proteinSel.appendChild(el('option', {text:p, attrs:{value:p}})));
  proteinSel.value = state.filterProtein;

  filterRow.appendChild(cuisineSel);
  filterRow.appendChild(proteinSel);
  wrap.appendChild(filterRow);

  const listContainer = el('div');
  wrap.appendChild(listContainer);

  function applyFilters(){
    const q = (state.searchQuery || '').trim().toLowerCase();
    return allRecipes.filter(r=>{
      const matchesSearch = !q || r.name.toLowerCase().includes(q) || r.ingredients.some(i=> i.name.toLowerCase().includes(q));
      const matchesCuisine = !state.filterCuisine || r.cuisine===state.filterCuisine;
      const matchesProtein = !state.filterProtein || (r.proteins||[]).includes(state.filterProtein);
      return matchesSearch && matchesCuisine && matchesProtein;
    });
  }

  function updateModeUI(){
    fabRow.style.display = state.selectMode ? 'none' : '';
    selectionBar.style.display = state.selectMode ? 'flex' : 'none';
    selectionCountLabel.textContent = 'เลือกแล้ว ' + state.selectedIds.size + ' สูตร';
  }

  function toggleSelect(id){
    if(state.selectedIds.has(id)) state.selectedIds.delete(id); else state.selectedIds.add(id);
    updateModeUI();
    renderCards();
  }

  function renderCards(){
    listContainer.innerHTML = '';
    const recipes = applyFilters();
    if(recipes.length===0){
      listContainer.appendChild(el('div', {class:'empty'}, [
        el('div', {text:'ไม่พบสูตรที่ตรงกับคำค้นหา/ตัวกรองนี้ค่ะ'})
      ]));
      return;
    }
    recipes.forEach(r=>{
      const main = r.ingredients[r.mainIndex];
      const tagPills = el('div', {class:'pill-row'});
      if(r.cuisine) tagPills.appendChild(el('span', {class:'pill', text:r.cuisine}));
      (r.proteins||[]).forEach(p=> tagPills.appendChild(el('span', {class:'pill', text:p})));

      const isSelected = state.selectedIds.has(r.id);
      const cardClass = 'card recipe-card' + (isSelected ? ' selected' : '') + (state.selectMode ? ' with-badge' : '');
      const card = el('div', {class:cardClass}, [
        state.selectMode ? el('div', {class:'select-badge' + (isSelected?' checked':'')}, [el('span', {text: isSelected ? '✓' : ''})]) : null,
        el('h3', {text:r.name || '(ไม่มีชื่อเมนู)'}),
        main ? el('span', {class:'tag', text:'วัตถุดิบหลัก: ' + main.name} ) : null,
        (r.cuisine || (r.proteins||[]).length) ? tagPills : null,
        el('div', {class:'meta', text: r.ingredients.length + ' วัตถุดิบ'})
      ]);

      let pressTimer = null;
      let longPressFired = false;
      const startPress = ()=>{
        longPressFired = false;
        pressTimer = setTimeout(()=>{
          longPressFired = true;
          if(!state.selectMode){ state.selectMode = true; state.selectedIds = new Set(); }
          toggleSelect(r.id);
        }, 480);
      };
      const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

      card.addEventListener('touchstart', startPress, {passive:true});
      card.addEventListener('touchend', cancelPress);
      card.addEventListener('touchmove', cancelPress);
      card.addEventListener('mousedown', startPress);
      card.addEventListener('mouseup', cancelPress);
      card.addEventListener('mouseleave', cancelPress);
      card.addEventListener('click', ()=>{
        if(longPressFired){ longPressFired = false; return; }
        if(state.selectMode){ toggleSelect(r.id); return; }
        state.recipeId = r.id; state.view='detail'; render();
      });

      listContainer.appendChild(card);
    });
  }
  renderCards();
  updateModeUI();

  searchInput.addEventListener('input', e=>{ state.searchQuery = e.target.value; renderCards(); });
  cuisineSel.addEventListener('change', e=>{ state.filterCuisine = e.target.value; renderCards(); });
  proteinSel.addEventListener('change', e=>{ state.filterProtein = e.target.value; renderCards(); });

  deleteSelectedBtn.addEventListener('click', ()=>{
    const count = state.selectedIds.size;
    if(count===0){ alert('ยังไม่ได้เลือกสูตรเลยค่ะ'); return; }
    if(confirm('ลบสูตรที่เลือกไว้ ' + count + ' สูตรเลยไหมคะ? กู้คืนไม่ได้นะคะ')){
      const remaining = loadRecipes().filter(r=> !state.selectedIds.has(r.id));
      saveRecipes(remaining);
      state.selectMode = false;
      state.selectedIds = new Set();
      state.view='list';
      render();
    }
  });

  cancelSelectBtn.addEventListener('click', ()=>{
    state.selectMode = false;
    state.selectedIds = new Set();
    updateModeUI();
    renderCards();
  });

  return wrap;
}

function renderForm(){
  const d = state.draft;
  const isEdit = !!d.id;
  const wrap = el('div');

  wrap.appendChild(el('div', {class:'backlink', text:'← กลับ', on:{click:()=>{ state.view = isEdit ? 'detail' : 'list'; render(); }}}));
  wrap.appendChild(el('h2', {class:'display', text: isEdit ? 'แก้ไขสูตร' : 'จดสูตรใหม่'}));

  wrap.appendChild(el('label', {text:'ชื่อเมนู'}));
  const nameInput = el('input', {attrs:{type:'text', placeholder:'เช่น ไก่ใต้น้ำ', value:d.name||''}});
  wrap.appendChild(nameInput);

  wrap.appendChild(el('div', {class:'section-title', text:'หมวดหมู่'}));
  wrap.appendChild(el('label', {text:'ประเภทอาหาร'}));
  const cuisineSelect = el('select', {});
  cuisineSelect.appendChild(el('option', {text:'ไม่ระบุ', attrs:{value:''}}));
  CUISINE_OPTIONS.forEach(c=> cuisineSelect.appendChild(el('option', {text:c, attrs:{value:c}})));
  cuisineSelect.value = d.cuisine || '';
  wrap.appendChild(cuisineSelect);

  wrap.appendChild(el('label', {text:'เนื้อสัตว์หลัก (เลือกได้หลายอย่าง)'}));
  const proteinBox = el('div', {class:'checkbox-list'});
  const proteinChecks = {};
  const selectedProteins = new Set(d.proteins || []);
  PROTEIN_OPTIONS.forEach(p=>{
    const cb = el('input', {attrs:{type:'checkbox'}});
    cb.checked = selectedProteins.has(p);
    proteinChecks[p] = cb;
    const lbl = el('label', {class:'checkbox-item'}, [cb, el('span', {text:p})]);
    proteinBox.appendChild(lbl);
  });
  wrap.appendChild(proteinBox);

  wrap.appendChild(el('div', {class:'section-title', text:'วัตถุดิบ'}));

  const pasteBox = el('textarea', {class:'paste-box', attrs:{placeholder:'วางข้อความวัตถุดิบได้เลยค่ะ ไม่ว่าจะก็อปจาก Google Sheet หรือจากบล็อก/เว็บสูตรอาหารก็ได้\n\nตัวอย่างจาก Sheet:\nเนื้อไก่\t1\tกก.\n\nตัวอย่างจากบล็อก:\nไส้กรอกอีสาน 300 กรัม\nหอมแดงซอย ½ ถ้วย'}});
  wrap.appendChild(pasteBox);
  wrap.appendChild(el('div', {class:'hint', text:'วางแล้วกด "แยกวัตถุดิบ" ด้านล่าง ระบบแยกได้ทั้งแบบคัดลอกจาก Google Sheet และแบบข้อความต่อเนื่องจากบล็อก/เว็บ ถ้าตรงไหนผิดแก้ในตารางด้านล่างได้เลย'}));

  const tableWrap = el('div', {attrs:{id:'ing-table-wrap'}});
  wrap.appendChild(tableWrap);

  let ingredients = d.ingredients.map(i=>({...i}));
  let mainIndex = d.mainIndex || 0;

  function renderIngTable(){
    tableWrap.innerHTML = '';
    if(ingredients.length===0) return;
    const table = el('table', {class:'ing-table'});
    table.appendChild(el('tr', {}, [
      el('th', {text:'หลัก'}), el('th', {text:'วัตถุดิบ'}), el('th', {text:'ปริมาณ'}), el('th', {text:'หน่วย'}), el('th', {})
    ]));
    ingredients.forEach((ing, idx)=>{
      const radio = el('input', {attrs:{type:'radio', name:'mainIng'}, class:'main-radio'});
      radio.checked = (idx===mainIndex);
      radio.addEventListener('change', ()=>{ mainIndex = idx; });

      const nameI = el('input', {class:'name-input', attrs:{type:'text', value:ing.name}});
      nameI.addEventListener('input', e=> ing.name = e.target.value);
      const amtI = el('input', {class:'amt-input', attrs:{type:'number', step:'any', value:ing.amount}});
      amtI.addEventListener('input', e=> ing.amount = parseFloat(e.target.value)||0);
      const unitI = el('input', {class:'unit-input', attrs:{type:'text', value:ing.unit}});
      unitI.addEventListener('input', e=> ing.unit = e.target.value);

      const delBtn = el('button', {class:'del-row', text:'✕', attrs:{type:'button'}});
      delBtn.addEventListener('click', ()=>{
        ingredients.splice(idx,1);
        if(mainIndex>=ingredients.length) mainIndex = Math.max(0, ingredients.length-1);
        renderIngTable();
      });

      const tr = el('tr', {}, [
        el('td', {}, [radio]), el('td', {}, [nameI]), el('td', {}, [amtI]), el('td', {}, [unitI]), el('td', {}, [delBtn])
      ]);
      table.appendChild(tr);
    });
    tableWrap.appendChild(table);
    tableWrap.appendChild(el('div', {class:'hint', text:'ติ๊กเลือกช่อง "หลัก" ตรงแถววัตถุดิบที่จะใช้อ้างอิงทอนสัดส่วน (เช่น เนื้อไก่)'}));
  }
  renderIngTable();

  const parseBtn = el('button', {class:'btn secondary block', text:'แยกวัตถุดิบจากข้อความ', attrs:{type:'button'}});
  parseBtn.addEventListener('click', ()=>{
    const parsed = parseIngredientText(pasteBox.value);
    if(parsed.length===0){ alert('ไม่พบข้อมูลวัตถุดิบในข้อความที่วาง ลองตรวจดูรูปแบบอีกครั้งนะคะ'); return; }
    ingredients = ingredients.concat(parsed);
    mainIndex = mainIndex || 0;
    pasteBox.value = '';
    renderIngTable();
  });
  wrap.appendChild(parseBtn);

  const addRowBtn = el('button', {class:'btn ghost block', text:'+ เพิ่มแถวว่าง', attrs:{type:'button'}});
  addRowBtn.style.marginTop='8px';
  addRowBtn.addEventListener('click', ()=>{
    ingredients.push({name:'', amount:0, unit:''});
    renderIngTable();
  });
  wrap.appendChild(addRowBtn);

  wrap.appendChild(el('div', {class:'section-title', text:'วิธีทำ'}));
  const stepsInput = el('textarea', {attrs:{placeholder:'พิมพ์วิธีทำตอนนี้เลย หรือเว้นว่างไว้ก่อนแล้วมาเพิ่มทีหลังก็ได้ค่ะ'}});
  stepsInput.value = d.instructions || '';
  wrap.appendChild(stepsInput);

  const saveBtn = el('button', {class:'btn block', text: isEdit ? 'บันทึกการแก้ไข' : 'บันทึกสูตรนี้'});
  saveBtn.style.marginTop='22px';
  saveBtn.addEventListener('click', ()=>{
    const name = nameInput.value.trim();
    if(!name){ alert('ใส่ชื่อเมนูก่อนนะคะ'); return; }
    if(ingredients.length===0){ alert('เพิ่มวัตถุดิบอย่างน้อย 1 อย่างก่อนนะคะ'); return; }
    const cuisine = cuisineSelect.value;
    const proteins = PROTEIN_OPTIONS.filter(p=> proteinChecks[p].checked);
    const recipes = loadRecipes();
    if(isEdit){
      const idx = recipes.findIndex(r=>r.id===d.id);
      recipes[idx] = { ...recipes[idx], name, ingredients, mainIndex, instructions: stepsInput.value, cuisine, proteins };
      state.recipeId = d.id;
    } else {
      const newRecipe = { id:uid(), name, ingredients, mainIndex, instructions: stepsInput.value, cuisine, proteins, createdAt: Date.now() };
      recipes.push(newRecipe);
      state.recipeId = newRecipe.id;
    }
    saveRecipes(recipes);
    state.view='detail';
    render();
  });
  wrap.appendChild(saveBtn);

  if(isEdit){
    const cancelBtn = el('button', {class:'btn ghost block', text:'ยกเลิก'});
    cancelBtn.style.marginTop='10px';
    cancelBtn.addEventListener('click', ()=>{ state.view='detail'; render(); });
    wrap.appendChild(cancelBtn);
  }

  return wrap;
}

function renderDetail(){
  const recipes = loadRecipes();
  const r = recipes.find(x=>x.id===state.recipeId);
  if(!r){ state.view='list'; return renderList(); }
  const wrap = el('div');

  wrap.appendChild(el('div', {class:'backlink', text:'← กลับสมุดสูตร', on:{click:()=>{ state.view='list'; render(); }}}));
  wrap.appendChild(el('h2', {class:'display', text:r.name}));

  if(r.cuisine || (r.proteins||[]).length){
    const tagPills = el('div', {class:'pill-row', attrs:{style:'margin-top:8px;'}});
    if(r.cuisine) tagPills.appendChild(el('span', {class:'pill', text:r.cuisine}));
    (r.proteins||[]).forEach(p=> tagPills.appendChild(el('span', {class:'pill', text:p})));
    wrap.appendChild(tagPills);
  }

  const main = r.ingredients[r.mainIndex];

  // scale box
  if(main){
    const scaleBox = el('div', {class:'scale-box'});
    const ratioStampEl = el('div', {class:'ratio-stamp', text:'1.0×'});
    scaleBox.appendChild(ratioStampEl);
    scaleBox.appendChild(el('label', {text:'มี "' + main.name + '" อยู่เท่าไหร่ (' + (main.unit||'หน่วย') + ')'}));
    const row = el('div', {class:'row'});
    const scaleInput = el('input', {attrs:{type:'number', step:'any', value:main.amount}});
    row.appendChild(scaleInput);
    scaleBox.appendChild(row);
    wrap.appendChild(scaleBox);

    const ingList = el('div', {class:'card'});
    function renderIngView(ratio){
      ingList.innerHTML = '';
      r.ingredients.forEach((ing, idx)=>{
        const scaled = (ing.amount * ratio);
        const scaledStr = (Math.round(scaled*100)/100).toString();
        const rowEl = el('div', {class:'ing-view-row' + (idx===r.mainIndex?' is-main':'')}, [
          el('span', {class:'name', text: ing.name}),
          el('span', {class:'amt', text: scaledStr + (ing.unit?(' '+ing.unit):'')})
        ]);
        ingList.appendChild(rowEl);
      });
    }
    function updateRatio(){
      const val = parseFloat(scaleInput.value) || 0;
      const ratio = main.amount>0 ? (val/main.amount) : 1;
      ratioStampEl.textContent = (Math.round(ratio*100)/100) + '×';
      renderIngView(ratio);
    }
    scaleInput.addEventListener('input', updateRatio);
    wrap.appendChild(ingList);
    updateRatio();
  } else {
    const ingList = el('div', {class:'card'});
    r.ingredients.forEach(ing=>{
      ingList.appendChild(el('div', {class:'ing-view-row'}, [
        el('span', {class:'name', text: ing.name}),
        el('span', {class:'amt', text: ing.amount + (ing.unit?(' '+ing.unit):'')})
      ]));
    });
    wrap.appendChild(ingList);
  }

  wrap.appendChild(el('div', {class:'section-title', text:'วิธีทำ'}));
  const stepsCard = el('div', {class:'card', attrs:{id:'steps-card'}});
  function renderSteps(){
    stepsCard.innerHTML = '';
    if(r.instructions && r.instructions.trim()){
      stepsCard.appendChild(el('div', {class:'steps-view', text:r.instructions}));
    } else {
      stepsCard.appendChild(el('div', {class:'steps-view empty-steps', text:'ยังไม่ได้เขียนวิธีทำ กดแก้ไขเพื่อเพิ่มได้เลยค่ะ'}));
    }
    const editBtn = el('button', {class:'btn secondary', text:'✎ แก้ไขวิธีทำ'});
    editBtn.style.marginTop='12px';
    editBtn.addEventListener('click', ()=>{
      stepsCard.innerHTML='';
      const ta = el('textarea', {});
      ta.value = r.instructions || '';
      ta.style.minHeight = '160px';
      stepsCard.appendChild(ta);
      const saveStepsBtn = el('button', {class:'btn', text:'บันทึกวิธีทำ'});
      saveStepsBtn.style.marginTop='10px';
      saveStepsBtn.addEventListener('click', ()=>{
        r.instructions = ta.value;
        const all = loadRecipes();
        const idx = all.findIndex(x=>x.id===r.id);
        all[idx] = r;
        saveRecipes(all);
        renderSteps();
      });
      stepsCard.appendChild(saveStepsBtn);
    });
    stepsCard.appendChild(editBtn);
  }
  renderSteps();
  wrap.appendChild(stepsCard);

  const btnRow = el('div', {class:'row-btns'});
  const editRecipeBtn = el('button', {class:'btn secondary', text:'แก้ไขสูตร'});
  editRecipeBtn.addEventListener('click', ()=>{
    state.draft = { id:r.id, name:r.name, ingredients:r.ingredients, mainIndex:r.mainIndex, instructions:r.instructions, cuisine:r.cuisine||'', proteins:r.proteins||[] };
    state.view='form'; render();
  });
  const delBtn = el('button', {class:'btn danger', text:'ลบสูตรนี้'});
  delBtn.addEventListener('click', ()=>{
    if(confirm('ลบสูตร "' + r.name + '" เลยไหมคะ? กู้คืนไม่ได้นะคะ')){
      const all = loadRecipes().filter(x=>x.id!==r.id);
      saveRecipes(all);
      state.view='list'; render();
    }
  });
  btnRow.appendChild(editRecipeBtn);
  btnRow.appendChild(delBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

function renderBulk(){
  const wrap = el('div');
  wrap.appendChild(el('div', {class:'backlink', text:'← กลับสมุดสูตร', on:{click:()=>{ state.view='list'; render(); }}}));
  wrap.appendChild(el('h2', {class:'display', text:'นำเข้าหลายสูตรพร้อมกัน'}));
  wrap.appendChild(el('div', {class:'hint', text:'ใช้สำหรับวางข้อมูลจาก Google Sheet ที่มีคอลัมน์ MENU / INGREDIENT / AMOUNT / UNIT (และ HOW TO ถ้ามี) คัดลอกได้หลายเมนูพร้อมกันในครั้งเดียว — แถวไหนที่ช่อง MENU ว่าง ระบบจะเข้าใจว่าเป็นวัตถุดิบต่อของเมนูก่อนหน้า'}));

  if(!state.bulkPreview){
    const pasteBox = el('textarea', {class:'paste-box', attrs:{style:'min-height:200px;', placeholder:'วางข้อมูลจาก Google Sheet ตรงนี้ (คัดลอกทั้งช่วงรวมหลายเมนู)\n\nตัวอย่าง:\nพริกแกงส้มไทย\tพริกแห้งเม็ดใหญ่\t12\tเม็ด\n\tกระเทียม\t10\tกรัม\nกุ้งอบวุ้นเส้น\tน้ำเปล่า\t1\tถ้วยตวง'}});
    wrap.appendChild(pasteBox);

    const parseBtn = el('button', {class:'btn block', text:'แยกเป็นสูตร', attrs:{style:'margin-top:14px;'}});
    parseBtn.addEventListener('click', ()=>{
      const parsed = parseBulkSheet(pasteBox.value);
      if(parsed.length===0){ alert('ไม่พบข้อมูลที่แยกเป็นสูตรได้เลยค่ะ ลองเช็คว่าคัดลอกมาจาก Google Sheet แบบมี tab คั่นคอลัมน์หรือเปล่านะคะ'); return; }
      state.bulkPreview = parsed.map(r=> ({ ...r, include:true }));
      render();
    });
    wrap.appendChild(parseBtn);
    return wrap;
  }

  wrap.appendChild(el('div', {class:'section-title', text: 'พบ ' + state.bulkPreview.length + ' สูตร — เลือกสูตรที่จะนำเข้า'}));

  state.bulkPreview.forEach((r, idx)=>{
    const cb = el('input', {attrs:{type:'checkbox'}});
    cb.checked = r.include;
    cb.addEventListener('change', e=>{ r.include = e.target.checked; });
    const card = el('div', {class:'card bulk-preview-card'}, [
      el('label', {class:'checkbox-item'}, [
        cb,
        el('div', {}, [
          el('div', {attrs:{style:'font-weight:600;'}, text:r.name}),
          el('div', {class:'meta', text: r.ingredients.length + ' วัตถุดิบ'})
        ])
      ])
    ]);
    wrap.appendChild(card);
  });

  wrap.appendChild(el('div', {class:'hint', text:'นำเข้าแล้วยังไม่มีการเลือก "วัตถุดิบหลัก" กับหมวดหมู่ให้นะคะ ต้องเข้าไปกดแก้ไขสูตรทีละอันเพื่อตั้งค่าเพิ่มเติมทีหลัง'}));

  const importBtn = el('button', {class:'btn block', text:'นำเข้าสูตรที่เลือก', attrs:{style:'margin-top:8px;'}});
  importBtn.addEventListener('click', ()=>{
    const toImport = state.bulkPreview.filter(r=>r.include);
    if(toImport.length===0){ alert('ยังไม่ได้เลือกสูตรที่จะนำเข้าเลยค่ะ'); return; }
    const recipes = loadRecipes();
    toImport.forEach(r=>{
      recipes.push({
        id: uid(), name: r.name, ingredients: r.ingredients, mainIndex: 0,
        instructions: r.instructions || '', cuisine:'', proteins:[], createdAt: Date.now()
      });
    });
    saveRecipes(recipes);
    state.bulkPreview = null;
    state.view = 'list';
    render();
  });
  wrap.appendChild(importBtn);

  const cancelBtn = el('button', {class:'btn ghost block', text:'วางข้อความใหม่', attrs:{style:'margin-top:8px;'}});
  cancelBtn.addEventListener('click', ()=>{ state.bulkPreview = null; render(); });
  wrap.appendChild(cancelBtn);

  return wrap;
}

render();
</script>
